[package]
name = "elara-os"
version = "0.1.3"
edition = "2021"
rust-version = "1.89"
publish = false

[[bin]]
name = "elara-host"
path = "src/main.rs"

[dependencies]
rpassword = "=7.3.1"
cap-std = "=3.4.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
ring = "=0.17.14"
zeroize = "=1.8.2"

[dev-dependencies]
portable-pty = "=0.8.1"
